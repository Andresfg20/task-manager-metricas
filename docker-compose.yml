# Task Manager — whole system with one command (RNF-17, 10-devops/local-setup.md).
#   cp .env.example .env
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./src/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-local-only-string-of-32-plus-chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@taskmanager.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./src/frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  db-data:
